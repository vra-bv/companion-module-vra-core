name: Release

# Pushing a version tag (v1.2.3, or v1.2.3-beta.1 for a prerelease) packages the module and publishes it as a GitHub
# release with two assets, for studios that install the module by hand (Companion → Modules → Import module package):
#   vra-core-1.2.3.tgz  the version itself
#   vra-core.tgz        the same file under a fixed name, so this link always serves the newest stable release:
#                       https://github.com/<owner>/companion-module-vra-core/releases/latest/download/vra-core.tgz
# A release created by hand in the GitHub UI creates its tag too, so it runs this workflow as well.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag against package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare versions
        id: check
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          # A version with a pre-release part (1.2.3-beta.1) is published as a GitHub prerelease, so the
          # releases/latest link keeps serving the newest stable version.
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
        env:
          TAG: ${{ github.ref_name }}

  package:
    name: Package module
    needs: check-version
    permissions:
      packages: read
    uses: bitfocus/actions/.github/workflows/module-checks.yaml@main
    with:
      git-ref: ${{ github.ref_name }}
      prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
      upload-artifact: true

  publish:
    name: Publish release
    needs: [check-version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Needed to create the release and upload its assets
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          # The shared workflow always uploads its package as 'pkg', holding pkg.tgz
          name: pkg
      - name: Create the release and attach the package
        # gh is preinstalled on the runner. Re-running is safe: an existing release is kept and --clobber replaces
        # its assets.
        run: |
          NAME="${GITHUB_REPOSITORY#*/companion-module-}"
          NAME="${NAME//[^a-zA-Z0-9.-]/-}"
          cp pkg.tgz "$NAME-${TAG#v}.tgz"
          mv pkg.tgz "$NAME.tgz"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            FLAGS=(--generate-notes --verify-tag)
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" "${FLAGS[@]}"
          fi
          gh release upload "$TAG" "$NAME-${TAG#v}.tgz" "$NAME.tgz" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
